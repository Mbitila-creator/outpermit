<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Delete Request</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f7fb;
            padding:30px;
        }
        .card{
            background:white;
            max-width:600px;
            margin:auto;
            padding:25px;
            border-radius:12px;
            box-shadow:0 6px 18px rgba(0,0,0,0.08);
        }
        .btn{
            display:inline-block;
            margin-top:15px;
            margin-right:10px;
            padding:10px 16px;
            color:white;
            text-decoration:none;
            border:none;
            border-radius:8px;
            font-weight:600;
            cursor:pointer;
        }
        .btn-danger{ background:#dc3545; }
        .btn-secondary{ background:#6c757d; }
    </style>
</head>
<body>
<div class="card">
    <h2>Delete Request</h2>
    <p>Are you sure you want to delete request <strong>{{ req.reference_no }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'request_detail' req.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
