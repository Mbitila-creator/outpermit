<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Change Password</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f7fb;
            padding:30px;
            margin:0;
        }
        .card{
            background:white;
            max-width:500px;
            margin:auto;
            padding:25px;
            border-radius:12px;
            box-shadow:0 6px 18px rgba(0,0,0,0.08);
        }
        label{
            display:block;
            margin-top:12px;
            margin-bottom:6px;
            font-weight:700;
        }
        input{
            width:100%;
            padding:10px 12px;
            border:1px solid #d1d5db;
            border-radius:8px;
            box-sizing:border-box;
        }
        .btn{
            display:inline-block;
            padding:10px 14px;
            color:white;
            text-decoration:none;
            border:none;
            border-radius:8px;
            font-weight:700;
            cursor:pointer;
            margin-top:16px;
            margin-right:10px;
            background:#0b5ed7;
        }
        .btn-secondary{
            background:#6c757d;
        }
        .errorlist{
            color:#dc3545;
            margin:6px 0;
            padding-left:18px;
            font-size:13px;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Change Password</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <label for="{{ form.current_password.id_for_label }}">Current Password</label>
        {{ form.current_password }}
        {{ form.current_password.errors }}

        <label for="{{ form.new_password.id_for_label }}">New Password</label>
        {{ form.new_password }}
        {{ form.new_password.errors }}

        <label for="{{ form.confirm_new_password.id_for_label }}">Confirm New Password</label>
        {{ form.confirm_new_password }}
        {{ form.confirm_new_password.errors }}

        <a href="{% url 'requester_dashboard' %}" class="btn btn-secondary">Back</a>
        <button type="submit" class="btn">Update Password</button>
    </form>
</div>
</body>
</html>
