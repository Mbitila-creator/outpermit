<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reset Password</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f5f7fb;padding:30px;margin:0;}
        .card{background:white;max-width:700px;margin:auto;padding:25px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
        label{display:block;font-weight:700;margin:10px 0 6px;}
        input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;}
        .btn{display:inline-block;padding:10px 14px;background:#0b5ed7;color:white;text-decoration:none;border:none;border-radius:8px;font-weight:700;cursor:pointer;}
        .btn-secondary{background:#6c757d;}
        .errors{background:#fff5f5;border:1px solid #fecaca;color:#7f1d1d;padding:12px;border-radius:10px;margin-bottom:16px;}
    </style>
</head>
<body>
<div class="card">
    <h2>Reset Password: {{ target_user.username }}</h2>

    {% if form.errors %}
    <div class="errors">{{ form.errors }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label>New Password</label>
        {{ form.new_password }}

        <label>Confirm Password</label>
        {{ form.confirm_password }}

        <br><br>
        <button type="submit" class="btn">Reset Password</button>
        <a href="{% url 'user_management' %}" class="btn btn-secondary">Back</a>
    </form>
</div>
</body>
</html>
