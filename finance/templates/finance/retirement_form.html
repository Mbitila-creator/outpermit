<!DOCTYPE html>
<html>

<head>
    <title>Add Retirement</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            margin: 0;
        }

        .topbar {
            background: #0b5ed7;
            color: white;
            padding: 8px 22px;
        }

        .topbar h1 {
            margin: 0;
            font-size: 18px;
        }

        .container {
            padding: 25px;
            max-width: 900px;
            margin: auto;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            align-items: center;
        }

        button,
        .btn-back {
            padding: 7px 14px;
            font-size: 13px;
            border-radius: 6px;
            font-weight: 600;
            text-align: center;
            line-height: 1.3;
            transition: all 0.2s ease-in-out;
        }

        button {
            background: #0b5ed7;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn-back {
            background: #6c757d;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .btn-draft {
            background: #6c757d;
        }

        .btn-submit {
            background: #0b5ed7;
        }

        /* 🔥 Hover Effects */
        button:hover,
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
        }

        .btn-submit:hover {
            background: #084298;
        }

        .btn-draft:hover,
        .btn-back:hover {
            background: #5c636a;
        }

        /* Optional click effect */
        button:active,
        .btn-back:active {
            transform: translateY(0px);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>


<body>

    <div class="topbar">
        <h1>Add Retirement</h1>
    </div>

    <div class="container">

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <p>
                <label><strong>Attach Receipts / Tickets / Evidence:</strong></label>
                <input type="file" name="supporting_files" multiple accept=".pdf,image/*">
            </p>

            <div class="btn-row">
                <button type="submit" name="action" value="draft" class="btn-draft">
                    Save Draft
                </button>

                <button type="submit" name="action" value="submit" class="btn-submit">
                    Submit
                </button>

                <a href="{% url 'finance:dashboard' %}" class="btn-back">
                    ← Back
                </a>
            </div>
        </form>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const financeRequestField = document.getElementById("id_finance_request");
            const amountAccountedField = document.getElementById("id_amount_accounted");

            if (!financeRequestField || !amountAccountedField) {
                return;
            }

            financeRequestField.addEventListener("change", function () {
                const financeRequestId = this.value;

                if (!financeRequestId) {
                    amountAccountedField.value = "";
                    return;
                }

                fetch("{% url 'finance:get_finance_request_amount' %}?finance_request_id=" + financeRequestId)
                    .then(response => response.json())
                    .then(data => {
                        amountAccountedField.value = data.approved_amount;
                    })
                    .catch(error => {
                        console.error("Error fetching approved amount:", error);
                    });
            });
        });
    </script>

</body>

</html>
