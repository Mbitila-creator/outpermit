<!DOCTYPE html>
<html>

<head>
    <title>Create Minute Sheet</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            margin: 0;
            font-size: 13px;
        }

        .topbar {
            background: #0b5ed7;
            color: white;
            padding: 8px 22px;
            min-height: 38px;
            display: flex;
            align-items: center;
        }

        .topbar h1 {
            font-size: 18px;
            margin: 0;
            line-height: 1.1;
        }

        .container {
            padding: 14px;
            max-width: 850px;
            margin: auto;
        }

        .form-card {
            background: white;
            padding: 16px 20px;
            border-radius: 9px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
        }

        form p {
            margin: 0 0 8px 0;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px 10px;
            margin-top: 3px;
            margin-bottom: 6px;
            border: 1px solid #cfd6df;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 13px;
        }

        textarea {
            height: 38px;
            min-height: 38px;
            resize: vertical;
        }

        label {
            font-weight: bold;
            font-size: 13px;
        }

        input::placeholder,
        textarea::placeholder {
            color: #9aa7b5;
            opacity: 0.7;
        }

        .highlight-field {
            background: #f7fbff !important;
            border-left: 4px solid #0b5ed7 !important;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
        }

        button,
        .btn-back {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.2;
        }

        button {
            background: #0b5ed7;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn-back {
            display: inline-block;
            background: #6c757d;
            color: white;
            text-decoration: none;
        }

        .btn-back:hover {
            background: #5a6268;
        }

        .hidden-field {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <h1>Create Minute Sheet</h1>
    </div>

    <div class="container">

        <div class="form-card">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                {% if form.errors %}
                <div style="background:#fff3cd; padding:10px; border-left:5px solid #ffc107; margin-bottom:10px;">
                    {{ form.errors }}
                </div>
                {% endif %}

                {{ form.as_p }}

                <div class="btn-row">
                    <button type="submit" class="btn-submit">Submit</button>

                    <a href="{% url 'finance:dashboard' %}" class="btn-back">
                        ← Back
                    </a>
                </div>
            </form>
        </div>

    </div>

    <script>
        function setPlaceholderAndHideLabel(fieldId, placeholderText) {
            const field = document.getElementById(fieldId);

            if (field) {
                field.setAttribute("placeholder", placeholderText);
                field.classList.add("highlight-field");

                const label = document.querySelector("label[for='" + fieldId + "']");
                if (label) {
                    label.style.display = "none";
                }
            }
        }

        setPlaceholderAndHideLabel(
            "id_subject",
            "Subject: Write the main purpose of this minute sheet"
        );

        setPlaceholderAndHideLabel(
            "id_activity_series",
            "Activities / Justification: Explain the activity and why funds are needed"
        );

        const requestedAmount = document.getElementById("id_requested_amount");
        if (requestedAmount) {
            requestedAmount.setAttribute("type", "number");
            requestedAmount.setAttribute("step", "0.01");
            requestedAmount.setAttribute("min", "0");
            requestedAmount.setAttribute("placeholder", "Enter amount requested");
        }
    </script>

</body>

</html>
