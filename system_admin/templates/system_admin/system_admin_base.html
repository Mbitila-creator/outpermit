<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>{% block title %}System Admin{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            padding: 30px;
            margin: 0;
        }

        .card {
            background: white;
            max-width: 1100px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6c757d;
            margin-bottom: 18px;
        }

        .menu {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            margin-bottom: 18px;
        }

        .menu a {
            display: inline-block;
            padding: 6px 10px;
            background: #0b5ed7;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            line-height: 1.2;
            white-space: nowrap;
            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                background 0.18s ease;
        }

        .menu a:hover {
            background: #084298;
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
        }

        .section-title {
            margin-top: 10px;
            margin-bottom: 14px;
            font-size: 18px;
            font-weight: 700;
        }

        .form-row {
            margin-bottom: 14px;
        }

        .form-row label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            max-width: 520px;
            padding: 9px 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .checkbox-row {
            margin-bottom: 12px;
            font-weight: 600;
        }

        .btn-link,
        button {
            display: inline-block;
            padding: 8px 12px;
            background: #0b5ed7;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .btn-link:hover,
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        .btn-secondary {
            background: #6c757d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
        }

        .badge-approved {
            background: #d1e7dd;
            color: #0f5132;
        }

        .badge-rejected {
            background: #f8d7da;
            color: #842029;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #d1e7dd;
            color: #0f5132;
            font-weight: 600;
        }

        @media (max-width: 640px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 18px;
            }

            th,
            td {
                padding: 10px 8px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>{% block page_title %}System Admin{% endblock %}</h2>
        <div class="subtitle">Welcome, {{ request.user.username }}</div>

        <div class="menu">
            <a href="{% url 'system_home' %}">Home</a>
            <a href="{% url 'admin_dashboard' %}">Administration Centre</a>

            {% block active_menu %}
            {% endblock %}

            <a href="{% url 'logout' %}">Logout</a>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>
</body>

</html>
