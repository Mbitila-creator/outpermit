<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>System Maintenance</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 620px;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0 0 10px;
            color: #0b3a75;
        }

        p {
            color: #6b7280;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 10px;
            background: #0b5ed7;
            color: white;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="card">
            <div class="icon">🛠️</div>

            <h1>{{ system_name|default:"System Maintenance" }}</h1>

            <p>
                {{ message }}
            </p>

            <a href="{% url 'logout' %}" class="btn">Logout</a>
        </div>
    </div>
</body>
</html>
