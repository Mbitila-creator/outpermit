<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Events Management{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #111827;
        }

        .topbar {
            background: linear-gradient(90deg, #0f766e, #1D5FA7);
            color: white;
            padding: 16px 22px;
        }

        .topbar h2 { margin: 0; }

        .nav {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.18);
            padding: 7px 11px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 14px 28px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.07);
            margin-bottom: 16px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 9px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            margin: 4px;
        }

        .btn-primary { background: #1D5FA7; color: white; }
        .btn-secondary { background: #e5e7eb; color: #111827; }
        .btn-success { background: #0f766e; color: white; }

        table {
            background: white;
            border-collapse: collapse;
            width: 100%;
        }

        th { background: #f3f4f6; }

        th, td {
            padding: 9px;
            border: 1px solid #e5e7eb;
            text-align: left;
        }

        .dashboard-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #111827;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.07);
            min-height: 92px;
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 18px 35px rgba(0,0,0,0.16);
        }

        .dashboard-card:active {
            transform: translateY(-2px) scale(0.98);
        }

        .card-icon {
            font-size: 26px;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.6);
        }

        .card-number {
            font-size: 28px;
            font-weight: bold;
            line-height: 1;
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            margin-top: 5px;
        }

        .card-text {
            color: #6b7280;
            margin-top: 4px;
            font-size: 12px;
        }

        .card-arrow {
            margin-left: auto;
            font-size: 28px;
            font-weight: bold;
        }

        .blue-card { background: #eff6ff; border: 1px solid #bfdbfe; }
        .green-card { background: #ecfdf5; border: 1px solid #bbf7d0; }
        .purple-card { background: #f5f3ff; border: 1px solid #ddd6fe; }
        .orange-card { background: #fff7ed; border: 1px solid #fed7aa; }

        @media (max-width: 600px) {
            .dashboard-card {
                min-height: 82px;
                padding: 14px;
            }

            .card-icon {
                width: 42px;
                height: 42px;
                font-size: 22px;
            }

            .card-number { font-size: 24px; }
            .card-title { font-size: 14px; }

            .nav a {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="topbar">
    <h2>Events Management</h2>

    <div class="nav">
        <a href="{% url 'system_home' %}">Home</a>
        <a href="{% url 'summit_admin_dashboard' %}">Dashboard</a>
        <a href="{% url 'event_list' %}">Events</a>
        <a href="{% url 'create_event' %}">Create Event</a>
        <a href="{% url 'participant_list' %}">Participants</a>
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
