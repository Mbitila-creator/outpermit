<!DOCTYPE html>
<html>
<head>
    <title>Registration Closed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family:Arial;background:#f4f7fb;padding:20px;text-align:center;">

<div style="max-width:500px;background:white;margin:auto;padding:30px;border-radius:12px;">
    <h2 style="color:#b91c1c;">Registration Closed</h2>

    <p>
        Registration for <strong>{{ event.name }}</strong> is currently closed.
    </p>

    <p>
        Event Code: <strong>{{ event.code }}</strong>
    </p>
</div>

</body>
</html>
