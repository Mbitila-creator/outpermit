<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Questionnaire Builder{% endblock %} — Event Management</title>
<style>
:root{--navy:#0b3a69;--teal:#087f73;--bg:#f4f7fb;--muted:#607087;--line:#d7e1eb;--danger:#a7251d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17263c}.hero{padding:24px 18px;background:linear-gradient(120deg,var(--navy),#145b91);color:#fff}.hero-inner,.wrap{max-width:1180px;margin:auto}.hero a{color:#aef0e6}.hero h1{margin:7px 0 0}.wrap{padding:24px 18px 50px}.toolbar,.actions,.item-actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.toolbar{margin-bottom:20px}.button,button{display:inline-block;padding:10px 14px;border:1px solid #b9c9d9;border-radius:8px;background:#fff;color:var(--navy);font-weight:700;text-decoration:none;cursor:pointer}.button.primary,button.primary{background:var(--teal);border-color:var(--teal);color:#fff}.button.danger,button.danger{color:var(--danger);border-color:#e6b7b3}.button.small,button.small{padding:7px 10px;font-size:13px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 18px #153b620b}.panel{padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{padding:19px}.card h2,.card h3{color:var(--navy);margin:0 0 8px}.muted{color:var(--muted)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e4f5f1;color:#08695f;font-size:12px;font-weight:800}.badge.draft{background:#fff1cb;color:#785800}.message{padding:12px 15px;border-radius:9px;background:#e3f6ee;margin-bottom:12px}.message.error{background:#fde5e3;color:#8f1d16}.section{margin:18px 0;border:1px solid var(--line);border-radius:12px;background:#fff}.section-head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.questions{padding:8px 16px}.question{padding:13px 0;border-bottom:1px solid #e8eef4;display:grid;grid-template-columns:1fr auto;gap:14px}.question:last-child{border:0}.options{margin:8px 0 0 20px;color:var(--muted)}.logic{margin-top:7px;padding:7px 9px;border-radius:7px;background:#fff4d6;color:#6b5200;font-size:13px}.builder-form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:700}.builder-input{width:100%;padding:10px;border:1px solid #b9c9d9;border-radius:8px;background:#fff}.field:has(textarea),.field:has(input[type=checkbox]){grid-column:1/-1}.field input[type=checkbox]{width:auto}.errorlist{color:#a7251d;margin:4px 0}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:720px){.builder-form{grid-template-columns:1fr}.section-head,.question{display:block}.item-actions{margin-top:10px}}
</style>{% block head %}{% endblock %}</head><body>
<header class="hero"><div class="hero-inner"><a href="{% url 'events:department_event_detail' event.slug %}">← {{ event.code }} operations</a><h1>{% block heading %}Questionnaire Builder{% endblock %}</h1></div></header>
<main class="wrap">
{% for message in messages %}<div class="message {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
