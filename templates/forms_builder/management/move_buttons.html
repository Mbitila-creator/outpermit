<form method="post" action="{% url 'forms_builder:component_action' event.slug questionnaire.pk component item.pk 'up' %}">{% csrf_token %}<button class="small" title="Move up">↑</button></form><form method="post" action="{% url 'forms_builder:component_action' event.slug questionnaire.pk component item.pk 'down' %}">{% csrf_token %}<button class="small" title="Move down">↓</button></form><form method="post" action="{% url 'forms_builder:component_action' event.slug questionnaire.pk component item.pk 'archive' %}" onsubmit="return confirm('Archive this item? Existing answers will be preserved.')">{% csrf_token %}<button class="small danger">Archive</button></form>
