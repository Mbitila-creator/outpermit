<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ questionnaire.name_en }} QR code</title><style>@page{size:A4;margin:18mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#17263c;margin:0}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#eef3f8}.sheet{min-height:245mm;display:flex;align-items:center;justify-content:center;text-align:center}.card{max-width:150mm;border:2px solid #d7e1eb;border-radius:16px;padding:16mm}.card img{width:85mm;height:85mm}.card h1{color:#0b3a69;margin:8mm 0 3mm}.card p{overflow-wrap:anywhere;color:#52647b}@media print{.toolbar{display:none}}</style></head><body><div class="toolbar"><strong>{{ event.code }} — Form QR code</strong><button type="button" onclick="window.print()">Print / Save as PDF</button></div><main class="sheet"><article class="card"><img src="{% url 'forms_builder:questionnaire_qr_image' event.slug questionnaire.pk %}" alt="QR code"><h1>{{ questionnaire.name_en }}</h1>{% if questionnaire.name_sw %}<h2>{{ questionnaire.name_sw }}</h2>{% endif %}<p>{{ event.title_en }}</p><p>Scan to open and complete the form</p><p>{{ public_form_url }}</p></article></main></body></html>
