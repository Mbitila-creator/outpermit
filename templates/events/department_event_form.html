<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create event — Event Management</title><style>body{margin:0;background:#f4f7fb;color:#17263c;font-family:Arial,sans-serif}.wrap{max-width:980px;margin:28px auto;padding:0 18px}.panel{background:#fff;border:1px solid #d7e1eb;border-radius:16px;padding:26px;box-shadow:0 8px 24px #153b6210}h1{margin-top:0;color:#0b3a69}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #b9c9d9;border-radius:8px}.field small{color:#607087;line-height:1.4}.field:has(#id_venue),.field:has(#id_new_venue_name){padding:14px;border:1px solid #d7e1eb;background:#f8fafc}.field:has(#id_venue){border-radius:12px 12px 0 0;border-bottom:0}.field:has(#id_new_venue_name){border-radius:0 0 12px 12px}.errors{color:#a61b1b}.actions{display:flex;gap:10px;margin-top:22px}.actions button,.actions a{padding:11px 16px;border:0;border-radius:9px;text-decoration:none;font-weight:700}.actions button{background:#087f73;color:white}.actions a{background:#e7edf4;color:#173b67}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="panel"><h1>Create departmental event</h1><form method="post" enctype="multipart/form-data">{% csrf_token %}{% if form.non_field_errors %}<div class="errors">{{ form.non_field_errors }}</div>{% endif %}<div class="grid">{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="errors">{{ field.errors }}</div>{% endif %}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}</div>{% endfor %}</div><div class="actions"><button type="submit">Create event</button><a href="{% url 'events:department_event_list' %}">Cancel</a></div></form></section></main></body></html>
