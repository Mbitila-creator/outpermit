<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create event — Event Management</title><style>body{margin:0;background:#f4f7fb;color:#17263c;font-family:Arial,sans-serif}.wrap{max-width:980px;margin:28px auto;padding:0 18px}.panel{background:#fff;border:1px solid #d7e1eb;border-radius:16px;padding:26px;box-shadow:0 8px 24px #153b6210}h1{margin-top:0;color:#0b3a69}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #b9c9d9;border-radius:8px}.field small{color:#607087;line-height:1.4}.field:has(#id_venue_mode),.field:has(#id_venue),.field:has(#id_new_venue_name),.field:has(#id_new_venue_country),.field:has(#id_new_venue_region),.field:has(#id_new_venue_council){padding:14px;border:1px solid #d7e1eb;background:#f8fafc}.field:has(#id_venue_mode){grid-column:1/-1;border-radius:12px}.field:has(#id_venue_mode) ul{display:flex;flex-wrap:wrap;gap:18px;margin:4px 0;padding:0;list-style:none}.field:has(#id_venue_mode) label{display:flex;align-items:center;gap:7px}.field:has(#id_venue_mode) input{width:auto}.venue-hidden{display:none}.errors{color:#a61b1b}.actions{display:flex;gap:10px;margin-top:22px}.actions button,.actions a{padding:11px 16px;border:0;border-radius:9px;text-decoration:none;font-weight:700}.actions button{background:#087f73;color:white}.actions a{background:#e7edf4;color:#173b67}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="panel"><h1>Create departmental event</h1><form method="post" enctype="multipart/form-data">{% csrf_token %}{% if form.non_field_errors %}<div class="errors">{{ form.non_field_errors }}</div>{% endif %}<div class="grid">{% for field in form %}<div class="field" data-field-name="{{ field.name }}"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="errors">{{ field.errors }}</div>{% endif %}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}</div>{% endfor %}</div><div class="actions"><button type="submit">Create event</button><a href="{% url 'events:department_event_list' %}">Cancel</a></div></form></section></main><script>document.addEventListener('DOMContentLoaded',()=>{const modeInputs=[...document.querySelectorAll('input[name="venue_mode"]')],existing=document.querySelector('[data-field-name="venue"]'),newFields=['new_venue_name','new_venue_country','new_venue_region','new_venue_council'].map(name=>document.querySelector(`[data-field-name="${name}"]`)),country=document.getElementById('id_new_venue_country'),region=document.getElementById('id_new_venue_region'),council=document.getElementById('id_new_venue_council');function filterSelect(select,key,value){[...select.options].forEach(option=>{if(!option.value)return;option.hidden=Boolean(value)&&option.dataset[key]!==value});if(select.selectedOptions[0]?.hidden)select.value=''}function filterRegions(){filterSelect(region,'country',country.value);filterCouncils()}function filterCouncils(){filterSelect(council,'region',region.value)}function showMode(){const mode=modeInputs.find(input=>input.checked)?.value||'EXISTING',isNew=mode==='NEW';existing.classList.toggle('venue-hidden',isNew);newFields.forEach(field=>field.classList.toggle('venue-hidden',!isNew));if(isNew)document.getElementById('id_venue').value=''}modeInputs.forEach(input=>input.addEventListener('change',showMode));country.addEventListener('change',filterRegions);region.addEventListener('change',filterCouncils);council.addEventListener('change',()=>{const option=council.selectedOptions[0];if(option?.value){region.value=option.dataset.region;country.value=option.dataset.country;filterRegions();region.value=option.dataset.region;filterCouncils();council.value=option.value}});showMode();filterRegions()});</script></body></html>
