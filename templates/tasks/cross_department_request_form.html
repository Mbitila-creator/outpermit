<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Department Staff</title><style>body{font-family:Arial;background:#f3f6fb;color:#122033}.wrap{max-width:850px;margin:30px auto;background:white;padding:28px;border-radius:14px}label{display:block;font-weight:700;margin-top:15px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #bccbdd;border-radius:7px}.btn{padding:12px 18px;border:0;border-radius:8px;background:#1769d2;color:white;font-weight:700;text-decoration:none;display:inline-block;margin-top:18px}.alt{background:#687583}.errorlist{color:#b42318}</style></head><body><main class="wrap"><h1>Request Staff from Another Department</h1><p>Select the other department’s Director. That Director will decide whether to approve and which staff to provide.</p><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% endfor %}<button class="btn" type="submit">Send Request</button> <a class="btn alt" href="{% url 'cross_department_requests' %}">Cancel</a></form></main></body></html>
