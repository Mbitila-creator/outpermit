<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Department Staff</title>
<style>body{font-family:Arial;background:#f3f6fb;color:#122033}.wrap{max-width:850px;margin:30px auto;background:white;padding:28px;border-radius:14px}label{display:block;font-weight:700;margin-top:15px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #bccbdd;border-radius:7px}input[type=checkbox]{width:auto;margin-right:8px}.btn{padding:12px 18px;border:0;border-radius:8px;background:#1769d2;color:white;font-weight:700;text-decoration:none;display:inline-block;margin-top:18px}.alt{background:#687583}.errorlist{color:#b42318}ul{list-style:none;padding:0}li label{font-weight:400;background:#f5f7fa;padding:8px;border-radius:6px}</style></head>
<body><main class="wrap"><h1>Request Additional Staff</h1><p>Select your existing internal team and its team leader, then select the Director or PS-direct organizational Head who will provide additional staff.</p>
<form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.non_field_errors }}
{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% endfor %}
<button class="btn" type="submit">Send Request</button> <a class="btn alt" href="{% url 'cross_department_requests' %}">Cancel</a></form>
</main>
<button id="datePickerDismissTarget" type="button" tabindex="-1" aria-hidden="true"
        style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;padding:0;border:0"></button>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const dismissTarget = document.getElementById("datePickerDismissTarget");

  function closeDateTimePicker(field) {
    window.setTimeout(function () {
      field.blur();
      if (dismissTarget) {
        try {
          dismissTarget.focus({preventScroll: true});
        } catch (error) {
          dismissTarget.focus();
        }
        dismissTarget.blur();
      }
    }, 0);
  }

  ["id_start_date", "id_due_date"].forEach(function (fieldId) {
    const field = document.getElementById(fieldId);
    if (!field) return;
    field.addEventListener("input", function () {
      closeDateTimePicker(field);
    });
    field.addEventListener("change", function () {
      closeDateTimePicker(field);
    });
    field.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === "Tab") {
        closeDateTimePicker(field);
      }
    });
  });

  const leaderField = document.getElementById("id_group_leader");
  const staffCheckboxes = Array.from(
    document.querySelectorAll('input[name="requesting_staff"]')
  );

  if (!leaderField || !staffCheckboxes.length) return;

  function staffName(checkbox) {
    const label = checkbox.closest("label");
    return label ? label.textContent.trim() : checkbox.value;
  }

  function syncTeamLeaderChoices() {
    const previousValue = leaderField.value;
    const selectedStaff = staffCheckboxes.filter(function (checkbox) {
      return checkbox.checked;
    });

    leaderField.innerHTML = '<option value="">Select the team leader</option>';
    selectedStaff.forEach(function (checkbox) {
      const option = document.createElement("option");
      option.value = checkbox.value;
      option.textContent = staffName(checkbox);
      option.selected = checkbox.value === previousValue;
      leaderField.appendChild(option);
    });

    if (!selectedStaff.some(function (checkbox) {
      return checkbox.value === previousValue;
    })) {
      leaderField.value = "";
    }
  }

  staffCheckboxes.forEach(function (checkbox) {
    checkbox.addEventListener("change", syncTeamLeaderChoices);
  });
  syncTeamLeaderChoices();
});
</script>
</body></html>
